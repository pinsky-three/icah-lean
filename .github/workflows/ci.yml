name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    name: Build + axiom audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib oleans
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}

      - name: Get Mathlib cache
        run: lake exe cache get

      # The axiom audit is enforced inside the build: ICAH/Main.lean contains
      # per-theorem `#guard_msgs in #print axioms` blocks that fail compilation
      # if any flagship result ever depends on more than the Lean kernel axioms
      # (propext, Classical.choice, Quot.sound). The project declares zero
      # axioms; NotCH and RCFModelComplete are explicit hypotheses.
      - name: Build
        run: lake build

      - name: Sorry count (must be 0)
        run: |
          count=$(grep -rn "sorry" ICAH/ ICAH.lean --include="*.lean" | grep -v "sorryAx\|-- " | wc -l | tr -d ' ')
          echo "sorry count: $count"
          test "$count" = "0"

      - name: Axiom count (must be 0)
        run: |
          count=$(grep -rn "^axiom " ICAH/ --include="*.lean" | wc -l | tr -d ' ')
          echo "project axiom count: $count"
          test "$count" = "0"

      - name: Install pinned Typst
        env:
          TYPST_VERSION: 0.14.2
          TYPST_SHA256: a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d
        run: |
          archive="/tmp/typst-${TYPST_VERSION}.tar.xz"
          curl -fL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o "$archive"
          echo "${TYPST_SHA256}  ${archive}" | sha256sum --check
          mkdir -p /tmp/typst-bin
          tar -xJf "$archive" -C /tmp/typst-bin --strip-components=1
          echo "/tmp/typst-bin" >> "$GITHUB_PATH"

      - name: Build paper
        run: make -C icah-paper-typst build
